[project]
name = "amazon-clone-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "redis>=5.2",
    "pydantic[email]>=2.9",
    "boto3>=1.43.93",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Depends() / Query() in a default is the FastAPI idiom, not a mutable-default bug.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
